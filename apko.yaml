contents:
  repositories:
    - "@local packages"
    - https://dl-cdn.alpinelinux.org/alpine/v3.20/main
    - https://dl-cdn.alpinelinux.org/alpine/v3.20/community
  packages:
    - alpine-baselayout-data
    - shieldcn
  paths:
    - path: /usr/share/fonts
      source: fonts/
      type: directory

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: nonroot

entrypoint:
  command: /usr/bin/shieldcn

cmd: serve --host 0.0.0.0 --port 5335

environment:
  SHIELDCN_PORT: "5335"
  SHIELDCN_HOST: "0.0.0.0"

annotations:
  org.opencontainers.image.title: "shieldcn"
  org.opencontainers.image.description: "Self-hosted badge server in Zig"
  org.opencontainers.image.source: "https://github.com/jal-co/shieldcn-zig"

archs:
  - x86_64
  - aarch64
