name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Install melange
        uses: chainguard-dev/actions/setup-melange@main

      - name: Generate signing key
        run: melange keygen

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            melange.rsa
            melange.rsa.pub

  release:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install Dagger CLI
        run: |
          cd /usr/local
          curl -L https://dl.dagger.io/dagger/install.sh | DAGGER_VERSION=0.21.7 sh
          cd -

      - name: Install melange
        uses: chainguard-dev/actions/setup-melange@main

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Cache Zig dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/zig
            zig-cache
            zig-out
          key: ${{ runner.os }}-zig-${{ hashFiles('**/*.zig', 'build.zig.zon') }}
          restore-keys: |
            ${{ runner.os }}-zig-

      - name: Dagger Lint
        run: dagger call lint --arg0=.

      - name: Dagger Test
        run: dagger call test --arg0=.

      - name: Build binary
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            TARGET="x86_64-linux-musl"
          else
            TARGET="aarch64-linux-musl"
          fi
          zig build -Doptimize=ReleaseFast -Dtarget=${TARGET}

      - name: Download signing key
        uses: actions/download-artifact@v4
        with:
          name: signing-key
          path: .

      - name: Build APK with melange
        run: |
          melange build melange.yaml \
            --arch ${{ matrix.arch }} \
            --out-dir packages/ \
            --source-dir . \
            --signing-key melange.rsa

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: packages/

  image:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: packages/

      - name: Download signing key
        uses: actions/download-artifact@v4
        with:
          name: signing-key
          path: .

      - name: Install apko
        run: |
          go install chainguard.dev/apko@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Publish to GHCR
        run: |
          apko publish apko.yaml \
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            ${{ env.IMAGE_NAME }}:latest \
            --arch amd64,arm64 \
            --repository-append packages/ \
            --keyring-append melange.rsa.pub

      - name: Sign OCI image with cosign
        run: |
          cosign sign \
            --yes \
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Sign OCI image latest with cosign
        run: |
          cosign sign \
            --yes \
            ${{ env.IMAGE_NAME }}:latest

      - name: Generate SBOM
        run: |
          apko sbom apko.yaml \
            --arch amd64,arm64 \
            --repository-append packages/ \
            --keyring-append melange.rsa.pub \
            --sbom-formats spdx-json \
            --output sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/shieldcn-*.apk
            sbom.spdx.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate SLSA Provenance
        uses: slsa-framework/slsa-github-generator@v2
        with:
          artifact: packages/shieldcn-*.apk
          output-name: provenance.intoto.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SLSA Provenance
        uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: provenance.intoto.jsonl

      - name: Attach SLSA Provenance to Release
        uses: softprops/action-gh-release@v2
        with:
          files: provenance.intoto.jsonl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
