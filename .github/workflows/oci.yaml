name: Build OCI Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Install melange
        uses: chainguard-dev/actions/setup-melange@main

      - name: Generate signing key
        run: melange keygen

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: |
            melange.rsa
            melange.rsa.pub

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build binary
        run: |
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            TARGET="x86_64-linux-musl"
          else
            TARGET="aarch64-linux-musl"
          fi
          zig build -Doptimize=ReleaseFast -Dtarget=${TARGET}

      - name: Install melange
        uses: chainguard-dev/actions/setup-melange@main

      - name: Download signing key
        uses: actions/download-artifact@v4
        with:
          name: signing-key
          path: .

      - name: Build APK with melange
        run: |
          melange build melange.yaml \
            --arch ${{ matrix.arch }} \
            --out-dir packages/ \
            --source-dir . \
            --signing-key melange.rsa

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.arch }}
          path: packages/

  image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: packages/

      - name: Download signing key
        uses: actions/download-artifact@v4
        with:
          name: signing-key
          path: .

      - name: Install apko
        run: |
          go install chainguard.dev/apko@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build OCI image with apko
        run: |
          apko build apko.yaml \
            shieldcn:latest \
            apko.tar \
            --arch amd64,arm64 \
            --repository-append packages/ \
            --keyring-append melange.rsa.pub

      - name: Publish to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          apko publish apko.yaml \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            --arch amd64,arm64 \
            --repository-append packages/ \
            --keyring-append melange.rsa.pub
