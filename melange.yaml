package:
  name: shieldcn
  version: 0.1.0
  epoch: 0
  description: shields.io alternative — self-hosted badge server in Zig
  copyright:
    - license: MIT

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.20/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.20/community
    packages:
      - alpine-baselayout-data
      - build-base
      - ca-certificates
      - curl
      - tar
      - xz
      - freetype-dev
      - sqlite-dev

pipeline:
  - runs: |
      # Install Zig 0.16.0 (Alpine 3.20 ships an older version)
      curl -L https://ziglang.org/download/0.16.0/zig-linux-${ARCH}-0.16.0.tar.xz | tar -xJ -C /tmp
      export PATH="/tmp/zig-linux-${ARCH}-0.16.0:$PATH"

      # Build static binary targeting musl
      zig build -Doptimize=ReleaseFast -Dtarget=${ARCH}-linux-musl

  - runs: |
      install -Dm755 zig-out/bin/shieldcn "${{targets.destdir}}"/usr/bin/shieldcn

  - uses: strip
