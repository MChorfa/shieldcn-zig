package:
  name: shieldcn
  version: 0.1.0
  epoch: 0
  description: shields.io alternative — self-hosted badge server in Zig
  copyright:
    - license: MIT

environment:
  contents:
    repositories:
      - https://dl-cdn.alpinelinux.org/alpine/v3.20/main
      - https://dl-cdn.alpinelinux.org/alpine/v3.20/community
    packages:
      - alpine-baselayout-data

pipeline:
  - runs: |
      install -Dm755 /home/build/zig-out/bin/shieldcn "${{targets.destdir}}"/usr/bin/shieldcn

  - uses: strip
